
services:
  sace-db:
    image: mysql:8.0
    container_name: sace-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: cippsv_ce
    ports:
      - "3306:3306"
    volumes:
      - sace-db-data:/var/lib/mysql
      # Importación automática de la base de datos legada al iniciar por primera vez
      - ./localhost.sql:/docker-entrypoint-initdb.d/localhost.sql
    networks:
      - sace-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: sace-phpmyadmin
    restart: always
    ports:
      - "8082:80"
    environment:
      PMA_HOST: sace-db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root_password_123
      MYSQL_ROOT_PASSWORD: root_password_123
    depends_on:
      - sace-db
    networks:
      - sace-network

  sace-backend:
    build:
      context: ./sace-backend
      dockerfile: Dockerfile
    container_name: sace-backend
    restart: always
    ports:
      - "4005:4000"
    environment:
      DATABASE_URL: mysql://root:root_password_123@sace-db:3306/cippsv_ce
      PORT: 4000
      JWT_SECRET: super_secret_jwt_key_sace_2026
    depends_on:
      - sace-db
    networks:
      - sace-network

  sace-frontend:
    build:
      context: ./sace-frontend
      dockerfile: Dockerfile
    container_name: sace-frontend
    restart: always
    ports:
      - "3005:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost/api
    depends_on:
      - sace-backend
    networks:
      - sace-network

  sace-proxy:
    image: nginx:alpine
    container_name: sace-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - sace-frontend
      - sace-backend
    networks:
      - sace-network

  sace-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: sace-tunnel
    restart: always
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    depends_on:
      - sace-proxy
    networks:
      - sace-network

volumes:
  sace-db-data:

networks:
  sace-network:
    driver: bridge
